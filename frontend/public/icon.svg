<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A24" />
      <stop offset="100%" stop-color="#0F0F15" />
    </linearGradient>

    <linearGradient id="streakGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <path d="M 256 116 A 140 140 0 1 1 157 157"
        fill="none"
        stroke="url(#streakGrad)"
        stroke-width="36"
        stroke-linecap="round" />

  <circle cx="157" cy="157" r="22" fill="#22c55e" filter="url(#glow)" />
  <circle cx="157" cy="157" r="10" fill="#FFFFFF" />
  
  <circle cx="256" cy="116" r="18" fill="url(#streakGrad)" />
</svg>
