version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kaizenfit_db
    environment:
      POSTGRES_USER: ${DB_USER:-kaizen}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kaizenpassword}
      POSTGRES_DB: ${DB_NAME:-kaizenfit}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: kaizenfit_backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-kaizen}:${DB_PASSWORD:-kaizenpassword}@db:5432/${DB_NAME:-kaizenfit}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:80}
      JWT_SECRET: ${JWT_SECRET:-supersafesecret123}
      PORT: 3000
    expose:
      - "3000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "" # Keep empty for relative Nginx proxying
    container_name: kaizenfit_frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
