version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: iota_db
    environment:
      POSTGRES_USER: ${DB_USER:-iota}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-iotapassword}
      POSTGRES_DB: ${DB_NAME:-iota}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: iota_backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-iota}:${DB_PASSWORD:-iotapassword}@db:5432/${DB_NAME:-iota}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-supersafesecret123}
      PORT: 3000
    expose:
      - "3000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "" # Keep empty for relative Nginx proxying
    container_name: iota_frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
