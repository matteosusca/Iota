version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kaizenfit_db_dev
    environment:
      POSTGRES_USER: kaizen
      POSTGRES_PASSWORD: kaizenpassword
      POSTGRES_DB: kaizenfit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data_dev:
